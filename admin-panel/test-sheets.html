<!DOCTYPE html>
<html>
<head>
    <title>Tab Test</title>
    <style>
        .subtab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .subtab-btn.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
        }
        
        .import-section { display: none; }
        .import-section.active { display: block; }
    </style>
</head>
<body>
    <div id="tabs">
        <button class="subtab-btn active" onclick="switchTab('manual')">Manual</button>
        <button class="subtab-btn" onclick="switchTab('csv')">CSV</button>
        <button class="subtab-btn" onclick="switchTab('sheets')">Google Sheets</button>
    </div>
    
    <div id="manual" class="import-section active">Manual content</div>
    <div id="csv" class="import-section">CSV content</div>
    <div id="sheets" class="import-section">Google Sheets content here!</div>
    
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.import-section').forEach(s => s.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }
    </script>
</body>
</html>
